<!DOCTYPE html>

<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>Jump Jump: World Runner - Portals</title>

<!-- Yandex Games SDK -->
<script>
  window.ysdk = null;
  window.yandexSDKReady = false;
  window.yandexGameReady = false;
  window.yandexLoadingReadySent = false;

  window.initSDK = async function initSDK() {
    try {
      window.ysdk = await YaGames.init();
      window.yandexSDKReady = true;

      if (window.yandexGameReady && !window.yandexLoadingReadySent) {
        window.ysdk.features.LoadingAPI?.ready();
        window.yandexLoadingReadySent = true;
      }

      window.dispatchEvent(new Event('yandex-sdk-ready'));
      console.log('[Yandex Games] SDK initialized');
    } catch (error) {
      console.error('[Yandex Games] SDK initialization failed:', error);
      window.dispatchEvent(new Event('yandex-sdk-error'));
    }
  };

  window.notifyYandexGameReady = function notifyYandexGameReady() {
    window.yandexGameReady = true;

    if (window.ysdk && !window.yandexLoadingReadySent) {
      window.ysdk.features.LoadingAPI?.ready();
      window.yandexLoadingReadySent = true;
    }
  };

  window.yandexGameplayStart = function yandexGameplayStart() {
    window.ysdk?.features.GameplayAPI?.start();
  };

  window.yandexGameplayStop = function yandexGameplayStop() {
    window.ysdk?.features.GameplayAPI?.stop();
  };
</script>
<script async src="/sdk.js" onload="initSDK()"></script>


<style>

  * { margin:0; padding:0; box-sizing:border-box; user-select:none; -webkit-tap-highlight-color:transparent; }

  html, body { height:100%; overflow:hidden; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }

  body { background:#070714; display:flex; align-items:center; justify-content:center; touch-action:none; }

  #game { position:relative; }

  canvas { display:block; border-radius:20px; box-shadow:0 25px 50px -12px rgba(0,0,0,0.8), 0 0 30px rgba(78,205,196,0.15); }

  .hud { position:absolute; top:20px; left:20px; right:20px; display:flex; justify-content:space-between; align-items:center; pointer-events:none; z-index:5; }

  .hud-card { background:rgba(15,15,30,0.6); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border:1px solid rgba(255,255,255,0.1); padding:8px 16px; border-radius:30px; box-shadow:0 8px 32px 0 rgba(0,0,0,0.3); }

  .score { font-size:18px; font-weight:800; color:#fff; text-shadow:0 0 10px rgba(255,107,107,0.8); }

  .level-info { font-size:13px; font-weight:700; color:#4ecdc4; letter-spacing:1px; text-transform:uppercase; }

  .overlay { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; background:rgba(8,8,20,0.88); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border-radius:20px; opacity:0; pointer-events:none; transition:opacity .3s; z-index:10; color:#fff; }

  .overlay.show { opacity:1; pointer-events:auto; }

  .overlay h1 { font-size:32px; font-weight:900; text-align:center; background:linear-gradient(135deg,#ff6b6b,#4ecdc4); -webkit-background-clip:text; -webkit-text-fill-color:transparent; filter:drop-shadow(0 4px 12px rgba(255,107,107,0.3)); }

  .overlay p { color:#a0a5c0; font-size:15px; text-align:center; padding:0 30px; line-height:1.4; }

  .btn { margin-top:10px; padding:14px 40px; border:none; border-radius:50px; background:linear-gradient(135deg,#ff6b6b,#ff8e8e); color:#fff; font-size:16px; font-weight:800; cursor:pointer; box-shadow:0 10px 25px -5px rgba(255,107,107,0.6); transition:transform .15s; letter-spacing:1px; }

  .btn:active { transform:scale(.95); }

  .btn.alt { margin-top:0; background:rgba(255,255,255,0.1); box-shadow:none; }

  .btn.ad { background:linear-gradient(135deg,#4ecdc4,#45b7aa); color:#070714; box-shadow:0 10px 25px -5px rgba(78,205,196,0.5); }

  .btn:disabled { opacity:.5; cursor:default; }

  .menu-btn { position:absolute; top:68px; left:20px; z-index:6; width:42px; height:36px; border-radius:12px; border:1px solid rgba(255,255,255,0.1); background:rgba(15,15,30,0.6); backdrop-filter:blur(12px); display:none; flex-direction:column; justify-content:center; align-items:center; gap:4px; cursor:pointer; }

  .menu-btn span { width:18px; height:2px; background:#fff; border-radius:2px; }

  .wallet { font-size:18px; font-weight:800; color:#ffd166; }

  .skin-grid { display:grid; grid-template-columns:repeat(2,130px); gap:12px; }

  .skin { background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1); border-radius:16px; padding:12px; display:flex; flex-direction:column; align-items:center; gap:8px; font-size:13px; font-weight:700; }

  .skin.sel { border-color:#4ecdc4; box-shadow:0 0 16px rgba(78,205,196,0.4); }

  .swatch { width:36px; height:36px; border-radius:50%; }

  .skin button { border:none; border-radius:20px; padding:6px 14px; font-weight:800; font-size:12px; cursor:pointer; background:#ff6b6b; color:#fff; }

  .skin button:disabled { opacity:.45; cursor:default; background:#555; }

  .rec { background:rgba(255,255,255,0.06); border-radius:16px; padding:16px 28px; font-size:16px; line-height:1.8; white-space:pre-line; text-align:center; }

</style>

</head>

<body>

<div id="game">

  <canvas id="c"></canvas>

  <div class="hud">

    <div class="hud-card level-info" id="lvlTitle">ЛОКАЦИЯ 1/3</div>

    <div class="hud-card score" id="score">🪙 0 · 0%</div>

  </div>

  <button class="menu-btn" id="pauseBtn" type="button" aria-label="Меню"><span></span><span></span><span></span></button>



  <div class="overlay show" id="menu">

    <h1>JUMP JUMP</h1>

    <p>Бесконечные локации, порталы, монеты и враги. Враги раздавливаются прыжком сверху!</p>

    <div class="wallet" id="walletMenu">🪙 0</div>

    <button class="btn" id="playBtn" type="button">ИГРАТЬ</button>

    <button class="btn alt" id="shopBtn" type="button">МАГАЗИН</button>

    <button class="btn alt" id="recBtn" type="button">РЕКОРДЫ</button>

  </div>



  <div class="overlay" id="shop">

    <h1>МАГАЗИН</h1>

    <div class="wallet" id="walletShop">🪙 0</div>

    <div class="skin-grid" id="skinGrid"></div>

    <button class="btn alt back" type="button">НАЗАД</button>

  </div>



  <div class="overlay" id="records">

    <h1>РЕКОРДЫ</h1>

    <div class="rec" id="recText"></div>

    <button class="btn alt back" type="button">НАЗАД</button>

  </div>



  <div class="overlay" id="pause">

    <h1>ПАУЗА</h1>

    <p>Если выйти в меню, монеты текущей локации не сохранятся.</p>

    <button class="btn" id="resumeBtn" type="button">ПРОДОЛЖИТЬ</button>

    <button class="btn alt" id="pauseMenuBtn" type="button">В МЕНЮ</button>

  </div>



  <div class="overlay" id="overlay">

    <h1 id="ovTitle">ПОРАЖЕНИЕ</h1>

    <p id="ovText"></p>

    <button class="btn ad" id="adBtn" type="button">▶ ПОСМОТРЕТЬ РЕКЛАМУ</button>

    <button class="btn" id="startBtn" type="button">ПОВТОРИТЬ ЛОКАЦИЮ</button>

    <button class="btn alt" id="restartBtn" type="button">НОВАЯ ИГРА</button>

    <button class="btn alt" id="menuBtn" type="button">В МЕНЮ</button>

  </div>
</div>

<script>

(() => {

  'use strict';

  const $ = id => document.getElementById(id);

  const canvas = $('c'), ctx = canvas.getContext('2d');

  const scoreEl = $('score'), lvlTitleEl =$('lvlTitle');

  const ovText = $('ovText'), startBtn = $('startBtn'), restartBtn =$('restartBtn');

  const pauseBtn = $('pauseBtn'), playBtn =$('playBtn'), shopBtn = $('shopBtn'), recBtn =$('recBtn');

  const walletMenu = $('walletMenu'), walletShop =$('walletShop'), skinGrid = $('skinGrid'), recText =$('recText');

  const resumeBtn = $('resumeBtn'), pauseMenuBtn = $('pauseMenuBtn'), pauseEl =$('pause');

  const adBtn = $('adBtn'), menuBtn = $('menuBtn');



  // Безопасная отрисовка скругленных прямоугольников (Полифил)

  if (!ctx.roundRect) {

    ctx.roundRect = function(x, y, w, h, r) {

      if (typeof r === 'number') r = [r, r, r, r];

      else if (!Array.isArray(r)) r = [0, 0, 0, 0];

      const r0 = r[0] || 0, r1 = r[1] || r0, r2 = r[2] || r0, r3 = r[3] || r1;

      this.moveTo(x + r0, y);

      this.lineTo(x + w - r1, y);

      this.quadraticCurveTo(x + w, y, x + w, y + r1);

      this.lineTo(x + w, y + h - r2);

      this.quadraticCurveTo(x + w, y + h, x + w - r2, y + h);

      this.lineTo(x + r3, y + h);

      this.quadraticCurveTo(x, y + h, x, y + h - r3);

      this.lineTo(x, y + r0);

      this.quadraticCurveTo(x, y, x + r0, y);

      return this;

    };

  }



  const W = 400, H = 700;

  function resize() {

    const s = Math.min(window.innerWidth / W, window.innerHeight / H);

    canvas.width = W; canvas.height = H;

    canvas.style.width = (W * s) + 'px';

    canvas.style.height = (H * s) + 'px';

  }

  resize();

  window.addEventListener('resize', resize);



  const TYPES = {

    UP:    { name: 'Вверх',   len: 6000, col: '#b46cff' },

    RIGHT: { name: 'Вправо', len: 7000, col: '#4ecdc4' },

    DOWN:  { name: 'Вниз',   len: 6000, col: '#ffd166' }

  };

  const TYPE_KEYS = Object.keys(TYPES);

  let cur = { type: 'UP', name: '', len: 6000, col: '#b46cff', next: 'RIGHT', n: 0 };



  let bank = 0, coins = 0, progress = 0, tick = 0, fade = 0, warp = null;

  let running = false, moveDir = 0, blinkTimer = 0, cameraX = 0, cameraY = 0;

  let player = null, platforms = [], coinList = [], enemies = [], particles = [], portal = null, bgElements = [];



  const rnd = (a, b) => a + Math.random() * (b - a);

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));



  for (let i = 0; i < 40; i++) {

    bgElements.push({

      x: Math.random() * W * 3 - W, y: Math.random() * H * 5 - H * 2,

      size: Math.random() * 3 + 1, alpha: Math.random() * 0.7 + 0.3, speed: Math.random() * 0.5 + 0.2

    });

  }



  function createParticles(x, y, count, color) {

    for (let i = 0; i < count; i++) {

      particles.push({

        x, y, vx: (Math.random() - 0.5) * 6, vy: (Math.random() - 0.5) * 6 - 1,

        size: Math.random() * 5 + 2, color: color || '#4ecdc4', life: 1, decay: Math.random() * 0.03 + 0.02

      });

    }

  }



  // ---------- Сохранения ----------

  const SAVE_KEY = 'jumpjump_save_v1';

  const save = { wallet: 0, best: 0, runs: 0, owned: ['classic'], skin: 'classic' };

  try { Object.assign(save, JSON.parse(localStorage.getItem(SAVE_KEY) || '{}')); } catch (e) {}

  function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} }



  let inv = 0;



  // ---------- Скины ----------

  const SKINS = [

    { id: 'classic', name: 'Классика', price: 0,   c: ['#ff9e9e', '#ff6b6b', '#d63447'], glow: '#ff6b6b' },

    { id: 'aqua',    name: 'Бирюза',   price: 50,  c: ['#a8fff4', '#4ecdc4', '#1b8f86'], glow: '#4ecdc4' },

    { id: 'gold',    name: 'Золото',   price: 120, c: ['#fff2b0', '#ffd166', '#e09f1f'], glow: '#ffd166' },

    { id: 'violet',  name: 'Неон',     price: 200, c: ['#e5c8ff', '#b46cff', '#6a2bd1'], glow: '#b46cff' },

    { id: 'acid',    name: 'Кислота',  price: 280, c: ['#e8ff9a', '#a8ff3e', '#35b85a'], glow: '#a8ff3e' },

    { id: 'plasma',  name: 'Плазма',   price: 350, c: ['#ffd0ff', '#ff4fd8', '#7a2cff'], glow: '#ff4fd8' },

    { id: 'ember',   name: 'Разряд',   price: 420, c: ['#ffe0a3', '#ff7a18', '#8f2cff'], glow: '#ff7a18' },

    { id: 'ice',     name: 'Лёд',      price: 500, c: ['#f4ffff', '#72d8ff', '#2856d8'], glow: '#72d8ff' }

  ];



  // Миграция старого сохранения: купленный радужный скин заменяем на «Плазму»,

  // чтобы игрок не потерял уже потраченные монеты.

  if (save.owned.includes('rainbow')) {

    save.owned = save.owned.filter(id => id !== 'rainbow');

    if (!save.owned.includes('plasma')) save.owned.push('plasma');

  }

  if (save.skin === 'rainbow') save.skin = 'plasma';

  persist();



  function skinStyle() {

    return SKINS.find(k => k.id === save.skin) || SKINS[0];

  }



  function renderShop() {

    walletShop.textContent = `🪙 ${save.wallet}`;

    skinGrid.textContent = '';

    SKINS.forEach(sk => {

      const owned = save.owned.includes(sk.id), sel = save.skin === sk.id;

      const card = document.createElement('div'); card.className = 'skin' + (sel ? ' sel' : '');

      const sw = document.createElement('div'); sw.className = 'swatch';

      sw.style.background = `radial-gradient(circle at 35% 30%, ${sk.c[0]}, ${sk.c[1]} 60%, ${sk.c[2]})`;

      const nm = document.createElement('div'); nm.textContent = sk.name;

      const b = document.createElement('button'); b.type = 'button';

      b.textContent = sel ? 'Выбрано' : owned ? 'Выбрать' : `🪙 ${sk.price}`;

      b.disabled = sel || (!owned && save.wallet < sk.price);

      b.onclick = () => {

        if (owned) save.skin = sk.id;

        else if (save.wallet >= sk.price) { save.wallet -= sk.price; save.owned.push(sk.id); save.skin = sk.id; }

        persist(); renderShop();

      };

      card.append(sw, nm, b);

      skinGrid.appendChild(card);

    });

  }



  // ---------- Экраны ----------

  function screen(id) {

    document.querySelectorAll('.overlay').forEach(o => o.classList.toggle('show', o.id === id));

    pauseBtn.style.display = id ? 'none' : 'flex';

  }

  function refreshMenu() { walletMenu.textContent = `🪙 ${save.wallet}`; }



  function updateAdButtonState() {
    if (!adBtn) return;

    if (window.yandexSDKReady && window.ysdk) {
      adBtn.disabled = false;
      adBtn.textContent = '▶ ПОСМОТРЕТЬ РЕКЛАМУ И ВОСКРЕСНУТЬ';
    } else {
      adBtn.disabled = true;
      adBtn.textContent = 'РЕКЛАМА ЗАГРУЖАЕТСЯ...';
    }
  }

  function showRewardedAd(onReward, onCancel) {
    if (!window.ysdk || !window.yandexSDKReady) {
      console.warn('[Yandex Games] Rewarded ad requested before SDK initialization');
      updateAdButtonState();
      if (onCancel) onCancel();
      return;
    }

    let rewarded = false;
    adBtn.disabled = true;
    window.yandexGameplayStop();

    try {
      window.ysdk.adv.showRewardedVideo({
        callbacks: {
          onOpen: () => {
            running = false;
            moveDir = 0;
          },

          onRewarded: () => {
            rewarded = true;
          },

          onClose: () => {
            adBtn.disabled = false;

            if (rewarded) {
              onReward();
            } else {
              if (onCancel) onCancel();
              window.yandexGameplayStop();
            }
          },

          onError: error => {
            console.error('[Yandex Games] Rewarded ad error:', error);
            adBtn.disabled = false;
            if (onCancel) onCancel();
            window.yandexGameplayStop();
          }
        }
      });
    } catch (error) {
      console.error('[Yandex Games] Rewarded ad call failed:', error);
      adBtn.disabled = false;
      if (onCancel) onCancel();
      window.yandexGameplayStop();
    }
  }

  function revive() {

    const tx = cur.type === 'RIGHT' ? cameraX + 120 : W / 2;

    const ty = cur.type === 'UP' ? cameraY + H * 0.6 : cur.type === 'DOWN' ? cameraY + H * 0.35 : H * 0.55;

    let best = platforms[0], bd = 1e9;

    for (const p of platforms) {

      const d = Math.hypot(p.x + p.w / 2 - tx, p.y - ty);

      if (d < bd) { bd = d; best = p; }

    }

    player.x = best.x + best.w / 2; player.y = best.y - player.r;

    player.vx = 0; player.vy = -11.5; player.scaleX = 1.35; player.scaleY = 0.65;

    for (const e of enemies) if (!e.dead && Math.hypot(e.x - player.x, e.y - player.y) < 160) e.dead = true;

    inv = 120; moveDir = 0; particles = []; fade = 0; warp = null;

    screen(null);

    running = true;

  }



  // ---------- Генерация фазы ----------

  function startPhase(type, n, next) {

    if (!next) { const o = TYPE_KEYS.filter(k => k !== type); next = o[Math.floor(Math.random() * o.length)]; }

    const g = Math.min(n * 0.04, 0.25);

    const dw = n * 2;

    const L = cur = { type, name: TYPES[type].name, len: TYPES[type].len + n * 600, col: TYPES[next].col, next, n };

    cameraX = cameraY = 0; moveDir = 0; progress = 0; coins = bank;

    platforms = []; coinList = []; enemies = []; particles = []; portal = null; warp = null; inv = 0;

    lvlTitleEl.textContent = `ЛОКАЦИЯ ${n + 1} · ${L.name}`;



    const addP = (x, y, w) => { const p = { x, y, w, h: 16 }; platforms.push(p); return p; };

    const addCoins = p => {

      const r = Math.random(), num = r < 0.15 ? 3 : r < 0.5 ? 1 : 0;

      for (let k = 0; k < num; k++) coinList.push({ x: p.x + p.w / 2 + (k - (num - 1) / 2) * 26, y: p.y - 34, got: false, t: Math.random() * 6 });

    };

    const addEn = (x, y, type, amp, t) => {

      if (type === 'h') amp = Math.min(amp, x - 30, W - 30 - x);

      enemies.push({ x, y, bx: x, by: y, type, amp, spd: rnd(0.03, 0.05) + t * 0.02 + cur.n * 0.003, ph: rnd(0, 6), r: 14, dead: false });

    };

    const mk = () => ({ x: 0, y: 0, vx: 0, vy: 0, r: 16, scaleX: 1, scaleY: 1 });



    if (L.type === 'UP') {

      player = Object.assign(mk(), { x: W / 2, y: H - 150, vy: -10 });

      addP(W / 2 - 50, H - 100, 100);

      let c = W / 2, y = H - 180, idx = 0;

      for (; y > -L.len; y -= 88, idx++) {

        const t = (H - 180 - y) / (H - 180 + L.len), w = Math.max(44, 80 - 20 * t - dw);

        c = clamp(c + rnd(-150, 150), 40 + w / 2, W - 40 - w / 2);

        addCoins(addP(c - w / 2, y, w));

        if (idx > 2 && Math.random() < 0.2 + 0.4 * t + g) addEn(rnd(80, W - 80), y - 44, 'h', rnd(50, 110), t);

      }

      const fx = clamp(c - 70, 20, W - 160);

      addP(fx, y, 140);

      portal = { x: fx + 70, y: y - 100, r: 36 };

    }

    else if (L.type === 'RIGHT') {

      player = Object.assign(mk(), { x: 100, y: H / 2, vy: -8 });

      addP(50, H / 2 + 50, 120);

      let ly = H / 2 + 50, x = 200, idx = 0;

      for (; x < L.len; x += 110, idx++) {

        const t = x / L.len, w = Math.max(44, 75 - 15 * t - dw);

        ly = clamp(ly + rnd(-90, 90), 230, 600);

        const p = addP(x, ly, w);

        addCoins(p);

        if (idx > 1 && Math.random() < 0.2 + 0.4 * t + g) addEn(x + (w + 110) / 2, ly - 70, 'v', 60, t);

      }

      addP(x, ly, 140);

      portal = { x: x + 70, y: ly - 90, r: 36 };

    }

    else {

      player = Object.assign(mk(), { x: W / 2, y: 100 });

      addP(W / 2 - 50, 150, 100);

      let c = W / 2, y = 235, idx = 0;

      for (; y < L.len; y += 85, idx++) {

        const t = y / L.len, w = Math.max(44, 80 - 20 * t - dw);

        c = clamp(c + rnd(-160, 160), 40 + w / 2, W - 40 - w / 2);

        addCoins(addP(c - w / 2, y, w));

        if (idx > 1 && Math.random() < 0.25 + 0.4 * t + g) addEn(rnd(80, W - 80), y - 42, 'h', rnd(50, 110), t);

      }

      addP(0, y, W / 2 - 70);

      addP(W / 2 + 70, y, W / 2 - 70);

      portal = { x: W / 2, y: y + 90, r: 38 };

    }

    updateHud();

  }



  function updateHud() {

    scoreEl.textContent = `🪙 ${coins} · ${Math.min(100, Math.floor(progress * 100))}%`;

  }



  // ---------- Управление ----------

  window.addEventListener('keydown', e => {

    if (e.code === 'ArrowLeft' || e.code === 'KeyA') moveDir = -1;

    if (e.code === 'ArrowRight' || e.code === 'KeyD') moveDir = 1;

  });

  window.addEventListener('keyup', e => {

    if (['ArrowLeft', 'KeyA', 'ArrowRight', 'KeyD'].includes(e.code)) moveDir = 0;

  });



  function touchDir(e) {

    if (e.touches.length > 0) moveDir = e.touches[0].clientX < window.innerWidth / 2 ? -1 : 1;

  }

  canvas.addEventListener('touchstart', touchDir, {passive: true});

  canvas.addEventListener('touchmove', touchDir, {passive: true});

  canvas.addEventListener('touchend', e => { if (e.touches.length === 0) moveDir = 0; });



  // ---------- Логика ----------

  function update() {

    if (!running) return;

    const type = cur.type;



    for (let i = particles.length - 1; i >= 0; i--) {

      const p = particles[i];

      p.x += p.vx; p.y += p.vy; p.life -= p.decay;

      if (p.life <= 0) particles.splice(i, 1);

    }



    if (warp) {

      warp.t++;

      const a = warp.t * 0.4, d = 50 * (1 - warp.t / 60);

      particles.push({ x: warp.x + Math.cos(a) * d, y: warp.y + Math.sin(a) * d, vx: 0, vy: 0, size: 3, color: cur.col, life: 0.7, decay: 0.05 });

      player.x += (warp.x - player.x) * 0.12;

      player.y += (warp.y - player.y) * 0.12;

      player.scaleX = player.scaleY = Math.max(0.05, 1 - warp.t / 60);

      fade = clamp((warp.t - 30) / 30, 0, 1);

      if (warp.t >= 60) {

        warp = null;

        save.wallet += coins - bank;

        save.best = Math.max(save.best, cur.n + 1);

        persist();

        bank = coins;

        startPhase(cur.next, cur.n + 1);

        fade = 1;

      }

      return;

    }



    fade = Math.max(0, fade - 0.025);

    if (inv > 0) inv--;



    // Физика

    player.vx += moveDir * 0.55;

    player.vx *= 0.86;

    player.x += player.vx;

    player.vy = Math.min(player.vy + 0.45, type === 'DOWN' ? 9 : 14);

    player.y += player.vy;

    player.scaleX += (1 - player.scaleX) * 0.15;

    player.scaleY += (1 - player.scaleY) * 0.15;



    if (Math.abs(player.vy) > 3 || Math.abs(player.vx) > 3) {

      if (Math.random() < 0.6) {

        particles.push({

          x: player.x + (Math.random() - 0.5) * 10, y: player.y + (Math.random() - 0.5) * 10,

          vx: -player.vx * 0.2, vy: -player.vy * 0.2, size: Math.random() * 4 + 2, color: skinStyle().glow, life: 0.8, decay: 0.05

        });

      }

    }



    // Столкновение с платформами

    if (player.vy > 0) {

      for (const p of platforms) {

        if (player.x + player.r > p.x && player.x - player.r < p.x + p.w &&

            player.y + player.r >= p.y && player.y - player.vy + player.r <= p.y + 10) {

          player.y = p.y - player.r;

          player.vy = -11.5;

          player.scaleX = 1.35; player.scaleY = 0.65;

          createParticles(player.x, player.y + player.r, 8, '#4ecdc4');

          break;

        }

      }

    }



    // Враги

    for (const e of enemies) {

      if (e.dead) continue;

      const s = Math.sin(tick * e.spd + e.ph) * e.amp;

      if (e.type === 'h') e.x = e.bx + s; else e.y = e.by + s;

      if (Math.hypot(player.x - e.x, player.y - e.y) < e.r + player.r - 3) {

        if (player.vy > 0 && player.y < e.y - 4) {

          e.dead = true; player.vy = -11.5; player.scaleX = 1.35; player.scaleY = 0.65;

          coins++; createParticles(e.x, e.y, 14, '#ff4d6d');

        } else if (inv <= 0) return gameOver();

      }

    }



    // Монеты

    for (const c of coinList) {

      if (!c.got && Math.hypot(player.x - c.x, player.y - c.y) < player.r + 10) {

        c.got = true; coins++; createParticles(c.x, c.y, 6, '#ffd166');

      }

    }



    // Портал

    if (portal && Math.hypot(player.x - portal.x, player.y - portal.y) < portal.r + 4) {

      warp = { t: 0, x: portal.x, y: portal.y };

      return;

    }



    // Камера и Прогресс

    const len = cur.len;

    if (type === 'UP') {

      if (player.x < -player.r) player.x = W + player.r;

      if (player.x > W + player.r) player.x = -player.r;

      if (player.y - cameraY < H * 0.5) cameraY = player.y - H * 0.5;

      progress = Math.max(progress, (H - 150 - player.y) / (H - 150 + len));

      if (player.y - cameraY > H + 40) return gameOver();

    }

    else if (type === 'RIGHT') {

      cameraX = Math.max(cameraX, player.x - 100);

      progress = Math.max(progress, (player.x - 100) / len);

      if (player.y > H + 50 || player.x < cameraX - 40) return gameOver();

    }

    else {

      if (player.x < -player.r) player.x = W + player.r;

      if (player.x > W + player.r) player.x = -player.r;

      if (player.y - cameraY > H * 0.4) cameraY = player.y - H * 0.4;

      progress = Math.max(progress, (player.y - 100) / len);

      if (player.y - cameraY < -60 || player.y - cameraY > H + 60) return gameOver();

    }

    updateHud();

  }



  function gameOver() {

    running = false;

    fade = 0;

    ovText.textContent = `Локаций пройдено: ${cur.n} · Монеты в банке: ${bank}` +

      (coins > bank ? ` (потеряно: ${coins - bank})` : '') + '. Не сдавайся!';

    adBtn.style.display = 'block';

    screen('overlay');

  }



  // ---------- Отрисовка ----------

  function drawBackground() {

    const type = cur.type;

    const grad = ctx.createLinearGradient(0, 0, 0, H);

    if (type === 'UP') { grad.addColorStop(0, '#1a102f'); grad.addColorStop(0.5, '#2d1436'); grad.addColorStop(1, '#481736'); }

    else if (type === 'RIGHT') { grad.addColorStop(0, '#091526'); grad.addColorStop(0.6, '#0f2b48'); grad.addColorStop(1, '#163e5c'); }

    else { grad.addColorStop(0, '#0a0d1a'); grad.addColorStop(0.5, '#101728'); grad.addColorStop(1, '#08212b'); }

    ctx.fillStyle = grad;

    ctx.fillRect(0, 0, W, H);



    bgElements.forEach(bg => {

      let rx = (bg.x - cameraX * bg.speed) % (W * 2); if (rx < 0) rx += W * 2; rx -= W * 0.5;

      let ry = (bg.y - cameraY * bg.speed) % (H * 2); if (ry < 0) ry += H * 2; ry -= H * 0.5;

      ctx.fillStyle = `rgba(255,255,255,${bg.alpha})`;

      ctx.beginPath(); ctx.arc(rx, ry, bg.size, 0, Math.PI * 2); ctx.fill();

    });

  }



  function drawPortal(p) {

    const t = tick * 0.05, pulse = 1 + Math.sin(t * 2) * 0.06, col = cur.col;

    ctx.save();

    ctx.translate(p.x, p.y);

    const g = ctx.createRadialGradient(0, 0, 2, 0, 0, p.r * pulse * 1.4);

    g.addColorStop(0, '#fff'); g.addColorStop(0.35, col); g.addColorStop(1, 'rgba(0,0,0,0)');

    ctx.fillStyle = g;

    ctx.beginPath(); ctx.arc(0, 0, p.r * pulse * 1.4, 0, Math.PI * 2); ctx.fill();

    ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.shadowColor = col; ctx.shadowBlur = 15;

    for (let k = 0; k < 3; k++) {

      ctx.save();

      ctx.rotate(t * (k % 2 ? -1 : 1) * (1 + k * 0.5));

      ctx.beginPath(); ctx.arc(0, 0, p.r * (1 - k * 0.22) * pulse, 0, Math.PI * 1.4); ctx.stroke();

      ctx.restore();

    }

    ctx.restore();

  }



  function drawEnemy(e) {

    ctx.save();

    ctx.translate(e.x, e.y);

    ctx.shadowColor = '#ff4d6d'; ctx.shadowBlur = 12;

    ctx.fillStyle = '#b5179e';

    ctx.save();

    ctx.rotate(tick * 0.03);

    for (let k = 0; k < 8; k++) {

      const a = k * Math.PI / 4, R = e.r + 8;

      ctx.beginPath();

      ctx.moveTo(Math.cos(a - 0.3) * e.r * 0.8, Math.sin(a - 0.3) * e.r * 0.8);

      ctx.lineTo(Math.cos(a) * R, Math.sin(a) * R);

      ctx.lineTo(Math.cos(a + 0.3) * e.r * 0.8, Math.sin(a + 0.3) * e.r * 0.8);

      ctx.fill();

    }

    ctx.restore();

    ctx.beginPath(); ctx.arc(0, 0, e.r, 0, Math.PI * 2); ctx.fill();

    ctx.shadowBlur = 0;

    ctx.fillStyle = '#fff';

    ctx.beginPath(); ctx.arc(-5, -2, 4, 0, Math.PI * 2); ctx.arc(5, -2, 4, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = '#1a1a2e';

    ctx.beginPath(); ctx.arc(-5, -1, 2, 0, Math.PI * 2); ctx.arc(5, -1, 2, 0, Math.PI * 2); ctx.fill();

    ctx.strokeStyle = '#1a1a2e'; ctx.lineWidth = 2;

    ctx.beginPath(); ctx.moveTo(-9, -8); ctx.lineTo(-2, -5); ctx.moveTo(9, -8); ctx.lineTo(2, -5); ctx.stroke();

    ctx.restore();

  }



  function drawCoin(c) {

    const sx = Math.max(0.15, Math.abs(Math.cos(tick * 0.06 + c.t)));

    ctx.save();

    ctx.translate(c.x, c.y + Math.sin(tick * 0.08 + c.t) * 3);

    ctx.scale(sx, 1);

    ctx.shadowColor = '#ffd166'; ctx.shadowBlur = 10;

    ctx.fillStyle = '#ffd166';

    ctx.beginPath(); ctx.arc(0, 0, 9, 0, Math.PI * 2); ctx.fill();

    ctx.shadowBlur = 0;

    ctx.strokeStyle = '#e09f1f'; ctx.lineWidth = 2;

    ctx.beginPath(); ctx.arc(0, 0, 5.5, 0, Math.PI * 2); ctx.stroke();

    ctx.restore();

  }



  function draw() {

    drawBackground();

    if (!player) return;



    ctx.save();

    ctx.translate(-cameraX, -cameraY);



    particles.forEach(p => {

      ctx.fillStyle = p.color;

      ctx.globalAlpha = Math.max(0, p.life);

      ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();

    });

    ctx.globalAlpha = 1;



    if (portal) drawPortal(portal);



    for (const p of platforms) {

      if (p.x + p.w >= cameraX && p.x <= cameraX + W && p.y + p.h >= cameraY && p.y <= cameraY + H) {

        ctx.fillStyle = 'rgba(0,0,0,0.25)';

        ctx.beginPath(); ctx.roundRect(p.x + 2, p.y + 4, p.w, p.h, 8); ctx.fill();

        const pg = ctx.createLinearGradient(p.x, p.y, p.x, p.y + p.h);

        pg.addColorStop(0, '#56ebd9'); pg.addColorStop(1, '#2ba89c');

        ctx.fillStyle = pg;

        ctx.beginPath(); ctx.roundRect(p.x, p.y, p.w, p.h, 8); ctx.fill();

        ctx.fillStyle = '#a8ffed';

        ctx.beginPath(); ctx.roundRect(p.x, p.y, p.w, 3, [8, 8, 0, 0]); ctx.fill();

      }

    }



    for (const c of coinList) {

      if (!c.got && c.x > cameraX - 20 && c.x < cameraX + W + 20 && c.y > cameraY - 20 && c.y < cameraY + H + 20) drawCoin(c);

    }

    for (const e of enemies) {

      if (!e.dead && e.x > cameraX - 40 && e.x < cameraX + W + 40 && e.y > cameraY - 40 && e.y < cameraY + H + 40) drawEnemy(e);

    }



    // Игрок

    ctx.save();

    ctx.translate(player.x, player.y);

    ctx.scale(player.scaleX, player.scaleY);

    if (inv > 0 && Math.floor(inv / 6) % 2) ctx.globalAlpha = 0.4;

    const sk = skinStyle();

    ctx.shadowColor = sk.glow; ctx.shadowBlur = 18;

    const bg = ctx.createRadialGradient(-2, -4, 2, 0, 0, player.r);

    bg.addColorStop(0, sk.c[0]); bg.addColorStop(0.7, sk.c[1]); bg.addColorStop(1, sk.c[2]);

    ctx.fillStyle = bg;

    ctx.beginPath(); ctx.arc(0, 0, player.r, 0, Math.PI * 2); ctx.fill();

    ctx.shadowBlur = 0;



    blinkTimer += 0.05;

    const blink = Math.sin(blinkTimer) > 0.98;

    const eo = Math.max(-4, Math.min(4, player.vx * 0.8));

    ctx.fillStyle = '#fff';

    if (blink) {

      ctx.fillRect(-6 + eo, -2, 4, 1); ctx.fillRect(2 + eo, -2, 4, 1);

    } else {

      ctx.beginPath(); ctx.arc(-4 + eo, -2, 4, 0, Math.PI * 2); ctx.arc(4 + eo, -2, 4, 0, Math.PI * 2); ctx.fill();

      ctx.fillStyle = '#1a1a2e';

      const py = -2 + Math.min(2, player.vy * 0.2), px = eo + player.vx * 0.2;

      ctx.beginPath(); ctx.arc(-3 + px, py, 2, 0, Math.PI * 2); ctx.arc(5 + px, py, 2, 0, Math.PI * 2); ctx.fill();

    }

    ctx.restore();

    ctx.restore();



    if (fade > 0) {

      ctx.fillStyle = `rgba(0,0,0,${fade})`;

      ctx.fillRect(0, 0, W, H);

    }

  }



  // Фиксированный шаг физики: игра не должна ускоряться на 120/144 Гц мониторах.

  const FIXED_STEP = 1000 / 60;

  let lastFrameTime = performance.now();

  let accumulator = 0;



  function loop(now = performance.now()) {

    requestAnimationFrame(loop);



    // Ограничиваем большой скачок времени после сворачивания вкладки.

    const frameTime = Math.min(100, Math.max(0, now - lastFrameTime));

    lastFrameTime = now;

    accumulator += frameTime;



    while (accumulator >= FIXED_STEP) {

      tick++;

      update();

      accumulator -= FIXED_STEP;

    }



    draw();

  }



  function begin(fromStart) {

    if (fromStart) { bank = 0; save.runs++; persist(); startPhase('UP', 0); }

    else startPhase(cur.type, cur.n, cur.next);

    fade = 0;

    running = true;

    screen(null);

  }



  function toMenu() { running = false; window.yandexGameplayStop(); bank = 0; startPhase('UP', 0); refreshMenu(); screen('menu'); }

  function pauseGame() { if (!running || warp) return; running = false; window.yandexGameplayStop(); screen('pause'); }

  function resumeGame() { screen(null); running = true; window.yandexGameplayStart(); }



  window.addEventListener('keydown', e => {

    if (e.code === 'Escape' || e.code === 'KeyP') {

      if (running) pauseGame(); else if (pauseEl.classList.contains('show')) resumeGame();

    }

  });



  playBtn.onclick = () => begin(true);

  shopBtn.onclick = () => { renderShop(); screen('shop'); };

  recBtn.onclick = () => {

    recText.textContent = `Лучший результат: ${save.best} лок.\nИгр сыграно: ${save.runs}\nМонет в кошельке: ${save.wallet}`;

    screen('records');

  };

  document.querySelectorAll('.back').forEach(b => b.onclick = () => { refreshMenu(); screen('menu'); });

  pauseBtn.onclick = pauseGame;

  resumeBtn.onclick = resumeGame;

  pauseMenuBtn.onclick = toMenu;

  startBtn.onclick = () => begin(false);

  restartBtn.onclick = () => begin(true);

  menuBtn.onclick = toMenu;

  adBtn.onclick = () => showRewardedAd(revive, () => screen('overlay'));



  startPhase('UP', 0);

  refreshMenu();

  screen('menu');

  loop();

})();

</script>
